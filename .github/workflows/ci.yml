name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref; only the latest commit matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Reads the pnpm version from the packageManager field in package.json,
      # so CI and local development cannot drift apart.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails the run if pnpm-lock.yaml is out of date with
      # package.json, rather than silently resolving different versions.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Runs `next typegen` first: LayoutProps and the other route types are
      # generated, so tsc cannot succeed on a clean checkout without them.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
